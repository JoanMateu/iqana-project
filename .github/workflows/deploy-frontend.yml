name: Deploy frontend (S3 + CloudFront)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      id-token: write     
      contents: read
    env:
      FRONT_BUCKET: ${{ vars.FRONT_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::276553701398:role/GithubActions-SAM-Deploy
          aws-region: eu-west-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install deps & Build
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${FRONT_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/index.html"
