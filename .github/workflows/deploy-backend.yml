name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  tests:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LOG_LEVEL: INFO
      COINBASE_API_KEY: test
      COINBASE_API_SECRET: test
      BACKEND_CORS_ORIGINS: http://localhost:5173
      CACHE_TTL_SECONDS: "3600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest with coverage (fail under 85%)
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

  deploy:
    name: Deploy backend (SAM)
    runs-on: ubuntu-latest
    needs: tests                     
    if: github.ref == 'refs/heads/main'   
    defaults:
      run:
        working-directory: backend
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::276553701398:role/GithubActions-SAM-Deploy
          aws-region: eu-west-3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"       

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate
        run: sam validate

      - name: Build
        run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --stack-name iqana-backend \
            --no-confirm-changeset \
            --region eu-west-3 \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM

      - name: Show API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name iqana-backend \
            --region eu-west-3 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
