AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Iqana Holdings API (FastAPI on Lambda behind HTTP API Gateway)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Architectures: [arm64]

Parameters:
  CoinbaseSecretName:
    Type: String
    Default: coinbase/creds
    Description: "Secrets Manager name for Coinbase API credentials (JSON keys: COINBASE_API_KEY, COINBASE_API_SECRET)"

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CoinbaseSecretName}*
      Environment:
        Variables:
          BACKEND_CORS_ORIGINS: "http://localhost:5173,https://d2u5ie2k7r9a0g.cloudfront.net"
          COINBASE_API_KEY: !Sub "{{resolve:secretsmanager:${CoinbaseSecretName}:SecretString:COINBASE_API_KEY}}"
          COINBASE_API_SECRET: !Sub "{{resolve:secretsmanager:${CoinbaseSecretName}:SecretString:COINBASE_API_SECRET}}"
      Events:
        RootAny:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"